# Checklist de seguridad H3: PRs automaticos con parches de dependencias.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      seguridad:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    groups:
      seguridad:
        applies-to: security-updates
        patterns: ['*']
